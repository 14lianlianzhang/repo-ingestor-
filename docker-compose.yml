version: "3.8"
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_ingestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: repo-ingestor-web
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CLONE_BASE_DIR=/tmp/repos
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/repo_ingestor
      - REDIS_URL=redis://redis:6379/0
      - WEBHOOK_DEDUP_TTL=86400
    depends_on:
      - redis
      - postgres

  worker:
    build: .
    container_name: repo-ingestor-worker
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CLONE_BASE_DIR=/tmp/repos
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/repo_ingestor
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

volumes:
  pgdata: